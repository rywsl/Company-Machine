suite: factory.types
kind: factory
base: example
description: 名义子类型、属性与 facts 的继承、extends 的兼容性（kernel/types.mrl）。
cases:
  - id: type-cycle
    patch:
      - {file: types/video.yaml, doc: 0, set: {spec.extends: video.mp4@1}}
    expect:
      codes: [E-CYCLE, E-CYCLE]
      diags:
        - {code: E-CYCLE, subject: "Type:video@1.0"}
        - {code: E-CYCLE, subject: "Type:video.mp4@1.3"}
  - id: extends-kind-mismatch
    patch:
      - {file: types/subtitle.yaml, doc: 0, set: {spec.kind: bundle, spec.fields: {text: doc.script@1}}}
    expect:
      codes: [E-EXTENDS, E-EXTENDS, E-EXTENDS, E-EXTENDS]
      diags:
        - {code: E-EXTENDS, subject: "Type:subtitle.srt@1.0", message: "种类 atomic 与父类型 subtitle@1 的种类 bundle 不同"}
  - id: extends-bundle-field-missing
    patch:
      - file: types/bundle.yaml
        content: |
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package, version: "1.0"}
          spec: {kind: bundle, fields: {video: video@1, script: doc.script@1}}
          ---
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package.short, version: "1.0"}
          spec: {kind: bundle, extends: package@1, fields: {video: video.mp4@1}}
    expect:
      codes: [E-EXTENDS]
      diags: [{code: E-EXTENDS, subject: "Type:package.short@1.0/fields.script"}]
  - id: extends-bundle-field-covariant
    description: 子类型的字段可以收窄为父类型字段的子类型
    patch:
      - file: types/bundle.yaml
        content: |
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package, version: "1.0"}
          spec: {kind: bundle, fields: {video: video@1, script: doc.script@1}}
          ---
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package.short, version: "1.0"}
          spec: {kind: bundle, extends: package@1, fields: {video: video.mp4@1, script: doc.script@1, cover: any}}
    expect: {clean: true}
  - id: extends-bundle-field-widened
    patch:
      - file: types/bundle.yaml
        content: |
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package, version: "1.0"}
          spec: {kind: bundle, fields: {video: video.mp4@1}}
          ---
          apiVersion: mao/v1
          kind: Type
          metadata: {name: package.short, version: "1.0"}
          spec: {kind: bundle, extends: package@1, fields: {video: video@1}}
    expect:
      codes: [E-EXTENDS]
  - id: extends-redefine-property
    patch:
      - {file: types/subtitle.yaml, doc: 1, set: {spec.properties.non_empty: "bean.facts.cue_count >= 1"}}
    expect:
      codes: [E-EXTENDS]
      diags: [{code: E-EXTENDS, subject: "Type:subtitle.srt@1.0/properties.non_empty", message: "已由 subtitle@1 定义"}]
  - id: extends-fact-type-conflict
    patch:
      - {file: types/subtitle.yaml, doc: 1, set: {spec.facts: {cue_count: float}}}
    expect:
      codes: [E-EXTENDS]
      diags: [{code: E-EXTENDS, subject: "Type:subtitle.srt@1.0/facts.cue_count", message: "类型冲突"}]
  - id: fact-emitted-but-undeclared
    patch:
      - {file: types/subtitle.yaml, doc: 1, set: {"spec.validators[0].emits": [cue_count, last_cue_end_s, encoding]}}
    expect:
      codes: [E-FACT]
      diags: [{code: E-FACT, subject: "Type:subtitle.srt@1.0/validators.srt-lint", message: "encoding"}]
  - id: fact-declared-but-not-emitted
    patch:
      - {file: types/video.yaml, doc: 1, set: {"spec.validators[0].emits": [duration_s, width, height, fps, vcodec, audio_streams]}}
    expect:
      codes: [E-FACT]
      diags: [{code: E-FACT, subject: "Type:video.mp4@1.3/facts.mean_volume_db"}]
  - id: abstract-type-needs-no-validator
    description: 没有 validator 的抽象类型（如 video@1）不要求 facts 被产出
    patch:
      - {file: types/video.yaml, doc: 0, set: {spec.facts.bitrate: int}}
    expect:
      codes: [E-FACT]
      diags: [{code: E-FACT, subject: "Type:video.mp4@1.3/facts.bitrate"}]
      absent: [{subject: "Type:video@1.0/facts.bitrate"}]
  - id: always-unknown-property
    patch:
      - {file: types/video.yaml, doc: 1, set: {spec.always: [hdr]}}
    expect:
      codes: [E-PROPERTY]
      diags: [{code: E-PROPERTY, subject: "Type:video.mp4@1.3/always"}]
  - id: always-covers-requires
    description: 类型恒真属性对每个 Bean 都成立，可以覆盖下游的 requires
    patch:
      - {file: types/video.yaml, doc: 1, set: {spec.always: [has_audio]}}
      - {file: stations/dub.yaml, set: {spec.outputs.video.guarantees: [hd]}}
      - {file: stations/explainer.yaml, set: {spec.outputs.video.guarantees: [hd]}}
    expect:
      clean: true
      resolutions: [{step: vertical, port: video, status: direct, props: [has_audio, hd]}]
  - id: always-inherited
    patch:
      - {file: types/subtitle.yaml, doc: 0, set: {spec.always: [non_empty]}}
      - {file: stations/dub.yaml, set: {spec.inputs.subtitle.requires: [non_empty]}}
    expect:
      clean: true
      resolutions: [{step: dub_en, port: subtitle, status: direct, props: [non_empty]}]
  - id: subtype-is-nominal
    description: 没有 extends 就没有子类型关系，即使结构相同
    patch:
      - file: types/clone.yaml
        content: |
          apiVersion: mao/v1
          kind: Type
          metadata: {name: video.clone, version: "1.0"}
          spec:
            facts: {duration_s: float, width: int, height: int, fps: num, vcodec: string, audio_streams: int, mean_volume_db: float}
      - {file: stations/quick-short.yaml, set: {spec.outputs.video.type: video.clone@1, spec.outputs.video.guarantees: []}}
      - {file: machines/moneyprinter/machine.yaml, set: {spec.recipes.quick-short.outputs.video.type: video.clone@1}}
      - file: lines/qs.yaml
        content: |
          apiVersion: mao/v1
          kind: Line
          metadata: {name: qs, version: 1}
          spec:
            interface: {inputs: {brief: {type: brief.video@1}}}
            budget: {cap_usd: 1.0}
            steps:
              make: {station: quick-short@1, in: {brief: $inputs.brief}}
              store: {station: publish-shorts@1, in: {video: make.video, meta: $inputs.brief}}
    expect:
      codes: [E-NO-CONVERTER, E-NO-CONVERTER]
      diags:
        - {code: E-NO-CONVERTER, subject: "Line:qs@1/steps.store.in.video", message: "video.clone@1 → video.mp4@1"}
        - {code: E-NO-CONVERTER, subject: "Line:qs@1/steps.store.in.meta"}
  - id: list-is-covariant
    patch:
      - file: lines/batch.yaml
        content: |
          apiVersion: mao/v1
          kind: Line
          metadata: {name: batch, version: 1}
          spec:
            interface: {inputs: {videos: {type: list<video.mp4@1>}}}
            budget: {cap_usd: 1.0}
            steps:
              store: {station: publish-s3@2, params: {bucket: b, prefix: p}, in: {artifact: $inputs.videos}}
    expect:
      clean: true
      resolutions: [{line: batch@1, step: store, port: artifact, status: direct, type: list<video.mp4@1>}]
