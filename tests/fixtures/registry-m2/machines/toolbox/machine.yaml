# 工具型机器（C 形态）：脚本操作工直接执行配方的 run。
apiVersion: mao/v1
kind: Machine
metadata: {name: toolbox, version: 1}
spec:
  form: tool
  runtime:
    image: mao-test/tool@sha256:09b42648636a8405354592f2ae8985670dfda5b61377ac6c75e3cebbd22e0500
    instance: per_job
    resources: {cpus: 1, memory: 256Mi}
  needs: {egress: none}
  recipes:
    upper:
      inputs:  {note: {type: note.text@1}}
      outputs: {note: {type: note.text@1}}
      run: [upper-text, /factory/in/note/note.txt, /factory/out/note/note.txt]
    note-to-text:
      inputs:  {in: {type: note.raw@1}}
      outputs: {out: {type: note.text@1, harvest: /factory/out/out/note.txt}}
      run: [upper-text, /factory/in/in/raw.txt, /factory/out/out/note.txt]
    publish-local:
      inputs:  {note: {type: note.text@1}}
      params:  {dir: {type: string}}
      outputs: {}
      run: [publish-copy, /factory/in/note/note.txt, "{{ params.dir }}"]
    local-file-check:
      inputs:  {note: {type: note.text@1}}
      outputs: {}
      run: [local-file-check]
    publish-flaky:
      inputs:  {note: {type: note.text@1}}
      outputs: {}
      run: [publish-flaky, /factory/in/note/note.txt]
    publish-templated:
      inputs:  {note: {type: note.text@1}}
      params:  {dir: {type: string}}
      outputs: {}
      run: [publish-copy, /factory/in/note/note.txt, "{{ params.dir }}"]
      receipt:
        target: "{{ params.dir }}"
        locator: {path: "{{ params.dir }}/note.txt"}
    quote:
      inputs:  {note: {type: note.text@1}}
      params:  {cost_estimate_usd: {type: float, default: 0.2}}
      outputs: {note: {type: note.text@1}}
      propose: [write-proposal, "{{ params.cost_estimate_usd }}", /factory/ctl/proposal.json]
      run: [upper-text, /factory/in/note/note.txt, /factory/out/note/note.txt]
    fail:
      inputs:  {note: {type: note.text@1}}
      outputs: {note: {type: note.text@1}}
      run: [exit-three, /factory/in/note/note.txt, /factory/out/note/note.txt]
    pull-notes:
      params:  {from_dir: {type: string}}
      outputs: {note: {type: note.text@1, harvest: /factory/out/note/note.txt}}
      run: [pull-notes, "{{ params.from_dir }}", /factory/out/note/note.txt]
    publish-staged:
      inputs:  {note: {type: note.text@1}}
      params:  {dir: {type: string}}
      outputs: {}
      propose: [write-proposal, "0", /factory/ctl/proposal.json]
      run: [publish-copy, /factory/in/note/note.txt, "{{ params.dir }}"]
    idle:
      inputs:  {note: {type: note.text@1}}
      outputs: {note: {type: note.text@1}}
      run: [upper-text, /factory/in/note/note.txt, /factory/out/note/note.txt]

