apiVersion: mao/v1
kind: Line
metadata: {name: note-trigger, version: 1}
spec:
  interface:
    inputs: {note: {type: note.text@1, requires: [non_empty]}}
  trigger:
    - {on: bean, type: note.text@1, label: "line=note-trigger"}
  budget: {cap_usd: 1.0}
  steps:
    upper:
      station: upper@1
      in: {note: $inputs.note}
  keep: [upper.note]
