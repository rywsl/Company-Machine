apiVersion: mao/v1
kind: Station
metadata: {name: pull-notes, version: 1}
spec:
  role: source
  machine: toolbox@1
  recipe: pull-notes
  operator: {runtime: script@1}
  params: {from_dir: {type: string}}
  inputs: {}
  outputs: {note: {type: note.text@1, guarantees: [non_empty]}}
  limits: {timeout: 60s, budget_usd: 0, retries: {rejected: 1, failed: 0, mode: fresh}}
  policy: source-local@1
