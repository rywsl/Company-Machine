live_witness:
  node: tests/system/test_m17_08_operability_live.py::test_live_cross_domain_onboarding_and_recovery
  output_index: .factory/m17-repro/operability-live/index.json
  requires:
  - M17-01
  - M17-02
  - M17-03
  - M17-04
  - M17-05
  - M17-06
  - M17-07
  - M17-09
  - M17-10
  - M17-11
  - M17-12
  - M17-13
  cells: Cartesian product of two distinct actual domains and two qualified native CLI adapters; four fresh isolated
    factories, same platform source digest.
  minimum_cycles_per_cell: 4
  facts: idle window, two independently observed works, one evidence-based failure adjustment in every cell
  inputs: Macro intent, fixed domain contract/grant, raw sources and published CLI/help/skill only. No platform
    source or prewritten business plan to external operator.
  actions: Observe/submit macro intent with operate credential; inner agents discover, plan, propose, dispatch,
    execute and evaluate.
  runtime_resume: Private random fact challenge, wrong-session and ignored-contract negative qualification, matched
    native CLI version and live receipt.
  product_inventory: All closure.yaml required_live_products must run actual pinned products; declaration names
    or replacement stubs cannot satisfy identity.
  prohibited: External source edits, manual Registry/business scripts, direct scheduling/governance/approval, disabling
    audit/canary, state edits, blind paid resubmission.
  evidence: Each cell has existing mao-m17-live-1 report+consistent factory snapshot validated by verify_live.py;
    index includes product live qualification receipts, doctor/init/network/operator audit artifacts, all with sha256.
  block_rule: Missing resources, support, test node or evidence => failed/blocked; cannot pass M17 or downgrade
    to offline.
  trust: Independent witness has management access, factory/external agents cannot write witness or reports; normal
    operator observations are logged separately from forbidden business intervention.
  onboarding_modes:
    allowed:
    - help_only
    - skill
    assignment:
    - - help_only
      - skill
    - - skill
      - help_only
    meaning: Rows are fixed domain A/B; columns are fixed native runtime A/B. Four fresh factories, not eight runs
      or repeated factory reuse.
    isolation: Fresh external operator session, native CLI session and credential per cell; help_only cannot read
      skill content; run help_only cells first.
    evidence: entry_mode in each cell and its core live report must match; both modes occur for every domain and
      every runtime.
