      - id: unit
        run: uv run python tools/harness.py pytest tests/system/test_ctl.py
        assert: out.failed == 0 && out.errors == 0 && out.passed >= 5
      - *regress
      - *lint
      - *format
      - *doccheck

  - id: M1-06
    milestone: M1
    title: 来料检验与出厂检验（V5）
    card: plan/tasks/M1-06.md
    deps: [M1-02, M1-03, M1-04]
    spec: [spec/system/README.md, spec/system/gate.md]
    paths: [src/mao/gate.py, src/mao/errors.py, tests/system/**]
