      - *lint
      - *format
      - *doccheck

  - id: M1-04
    milestone: M1
    title: 沙箱：SandboxProvider、DockerProvider、LocalProvider
    card: plan/tasks/M1-04.md
    deps: [M1-01]
    spec: [spec/system/README.md, spec/system/sandbox.md]
    paths: [src/mao/sandbox/**, src/mao/errors.py, tests/system/**]
    accept:
      - id: acceptance
        run: uv run python tools/harness.py pytest tests/acceptance/m1/test_m1_04_sandbox.py
        assert: out.failed == 0 && out.errors == 0 && out.skipped == 0 && out.passed >= 1
        env: {MAO_REQUIRE_DOCKER: "1"}
      - id: unit
        run: uv run python tools/harness.py pytest tests/system/test_sandbox.py
        assert: out.failed == 0 && out.errors == 0 && out.passed >= 5
      - *regress
      - *lint
      - *format
      - *doccheck

  - id: M1-05
    milestone: M1
    title: factoryctl 与控制通道（CtlServer）
    card: plan/tasks/M1-05.md
    deps: [M1-04]
    spec: [spec/system/README.md, spec/system/factoryctl.md]
    paths: [src/mao/ctl/**, src/mao/errors.py, tests/system/**]
    accept:
      - id: acceptance
        run: uv run python tools/harness.py pytest tests/acceptance/m1/test_m1_05_factoryctl.py
